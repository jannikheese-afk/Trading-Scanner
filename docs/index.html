<title>Signal-Scanner</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23161615'/%3E%3Cpath d='M6 21l6-6 5 4 9-10' fill='none' stroke='%230ca30c' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>
:root {
  color-scheme: light;
  --page: #f4f4f1;
  --surface: #fcfcfb;
  --surface-2: #f0efec;
  --ink: #0b0b0b;
  --ink-2: #52514e;
  --muted: #7a7873;
  --grid: #e1e0d9;
  --axis: #c3c2b7;
  --border: rgba(11,11,11,0.10);
  --bull: #0ca30c;
  --bull-ink: #006300;
  --bull-tint: rgba(12,163,12,0.10);
  --bear: #d03b3b;
  --bear-ink: #a32323;
  --bear-tint: rgba(208,59,59,0.10);
  --watch: #c98500;
  --watch-ink: #7a5200;
  --watch-tint: rgba(250,178,25,0.16);
  --s1: #2a78d6;  /* EMA 20 */
  --s2: #e87ba4;  /* EMA 50 */
  --s3: #eda100;  /* SMA 200 */
  --accent: #2a78d6;
  --shadow: 0 1px 2px rgba(0,0,0,0.04), 0 4px 16px rgba(0,0,0,0.04);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --page: #0d0d0d;
    --surface: #1a1a19;
    --surface-2: #232321;
    --ink: #ffffff;
    --ink-2: #c3c2b7;
    --muted: #8f8d86;
    --grid: #2c2c2a;
    --axis: #383835;
    --border: rgba(255,255,255,0.10);
    --bull-ink: #3fcf3f;
    --bull-tint: rgba(12,163,12,0.16);
    --bear: #e05252;
    --bear-ink: #f08080;
    --bear-tint: rgba(224,82,82,0.16);
    --watch: #fab219;
    --watch-ink: #fac458;
    --watch-tint: rgba(250,178,25,0.14);
    --s1: #3987e5;
    --s2: #d55181;
    --s3: #c98500;
    --accent: #3987e5;
    --shadow: none;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --page: #0d0d0d; --surface: #1a1a19; --surface-2: #232321; --ink: #ffffff; --ink-2: #c3c2b7;
  --muted: #8f8d86; --grid: #2c2c2a; --axis: #383835; --border: rgba(255,255,255,0.10);
  --bull-ink: #3fcf3f; --bull-tint: rgba(12,163,12,0.16); --bear: #e05252; --bear-ink: #f08080;
  --bear-tint: rgba(224,82,82,0.16); --watch: #fab219; --watch-ink: #fac458; --watch-tint: rgba(250,178,25,0.14);
  --s1: #3987e5; --s2: #d55181; --s3: #c98500; --accent: #3987e5; --shadow: none;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--page); color: var(--ink);
  font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  padding-bottom: env(safe-area-inset-bottom);
}
.wrap { max-width: 880px; margin: 0 auto; padding: 0 16px; }
.num { font-variant-numeric: tabular-nums; }
button { font: inherit; color: inherit; }

/* Kopf */
header { padding: 22px 0 6px; }
.title-row { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
h1 { font-size: 22px; line-height: 1.2; margin: 0; letter-spacing: -0.01em; }
.meta { color: var(--ink-2); font-size: 13px; margin-top: 4px; }
.demo-banner {
  margin: 14px 0 0; padding: 10px 12px; border-radius: 10px; font-size: 13.5px;
  background: var(--watch-tint); color: var(--ink); border: 1px solid var(--border);
}
.demo-banner b { color: var(--watch-ink); }

/* Kennzahlen = Richtungsfilter */
.tiles { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin: 16px 0 6px; }
.tile {
  background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
  padding: 12px 14px; box-shadow: var(--shadow); text-align: left; cursor: pointer;
}
.tile[aria-pressed="true"] { outline: 2px solid var(--accent); outline-offset: -1px; }
.tile .lbl { font-size: 12.5px; color: var(--ink-2); display: flex; align-items: center; gap: 6px; }
.tile .val { font-size: 26px; font-weight: 650; line-height: 1.15; margin-top: 4px; }
.tile .sub { font-size: 12px; color: var(--muted); }
@media (max-width: 560px) {
  .tiles { grid-template-columns: repeat(2, 1fr); gap: 8px; }
  .tile { padding: 10px 12px; }
  .tile .val { font-size: 22px; margin-top: 2px; }
}

/* Filter */
.filters {
  position: sticky; top: 0; z-index: 5; background: var(--page);
  padding: 10px 0 10px; border-bottom: 1px solid var(--border);
}
.card { scroll-margin-top: 110px; }
@media (max-width: 560px) {
  .filters { position: static; }
  .card { scroll-margin-top: 12px; }
}
.frow { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.frow + .frow { margin-top: 8px; }
.search {
  flex: 1 1 180px; min-width: 0; height: 38px; padding: 0 12px; border-radius: 10px;
  border: 1px solid var(--border); background: var(--surface); color: var(--ink); font: inherit;
}
.search:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
select.sort {
  height: 38px; border-radius: 10px; border: 1px solid var(--border); background: var(--surface);
  color: var(--ink); font: inherit; padding: 0 8px; max-width: 46%;
}
.chips {
  display: flex; flex-wrap: nowrap; gap: 6px; overflow-x: auto; scrollbar-width: none;
  margin: 8px -16px 0; padding: 0 16px 2px;
}
.chips::-webkit-scrollbar { display: none; }
@media (min-width: 561px) { .chips { flex-wrap: wrap; margin: 8px 0 0; padding: 0; overflow: visible; } }
.chip {
  flex: none; height: 32px; padding: 0 12px; border-radius: 999px; cursor: pointer;
  border: 1px solid var(--border); background: var(--surface); font-size: 13.5px; white-space: nowrap;
  display: inline-flex; align-items: center; gap: 6px;
}
.chip[aria-pressed="true"] { background: var(--ink); color: var(--page); border-color: var(--ink); }
.chip .cnt { color: var(--muted); font-size: 12px; }
.chip[aria-pressed="true"] .cnt { color: inherit; opacity: .7; }
.sep { width: 1px; height: 20px; background: var(--border); flex: none; }

/* Liste */
.count-line { color: var(--muted); font-size: 13px; margin: 12px 2px 8px; }
.list { display: flex; flex-direction: column; gap: 8px; padding-bottom: 24px; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; box-shadow: var(--shadow); }
.card-head {
  display: block; width: 100%; text-align: left; background: none; border: 0; padding: 12px 14px; cursor: pointer;
  border-radius: 12px;
}
.card-head:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
.row1 { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.tkr { font-weight: 700; font-size: 16px; }
.nm { color: var(--ink-2); font-size: 13px; margin-left: 6px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.left { display: flex; align-items: baseline; min-width: 0; }
.px { text-align: right; white-space: nowrap; }
.px .p { font-weight: 600; }
.chg { font-size: 13px; margin-left: 6px; }
.up { color: var(--bull-ink); } .down { color: var(--bear-ink); }
.sigs { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.sig {
  display: inline-flex; align-items: center; gap: 5px; font-size: 12.5px; padding: 3px 9px 3px 7px;
  border-radius: 999px; background: var(--surface-2); color: var(--ink); line-height: 1.35;
}
.sig .ic { font-size: 10px; }
.sig.bull { background: var(--bull-tint); } .sig.bull .ic { color: var(--bull); }
.sig.bear { background: var(--bear-tint); } .sig.bear .ic { color: var(--bear); }
.sig.watch { background: var(--watch-tint); } .sig.watch .ic { color: var(--watch); }
.sig .age { color: var(--muted); }
.badges { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
.badge { font-size: 12px; color: var(--ink-2); border: 1px solid var(--border); border-radius: 6px; padding: 1px 7px; }
.badge.conf { font-weight: 600; color: var(--ink); }
.no-sig { color: var(--muted); font-size: 13px; margin-top: 6px; }

/* Detail */
.detail { border-top: 1px solid var(--border); padding: 12px 14px 14px; }
.chart-box { position: relative; }
.chart-box svg { display: block; width: 100%; touch-action: pan-y; }
.tip {
  position: absolute; pointer-events: none; background: var(--surface); border: 1px solid var(--border);
  border-radius: 8px; padding: 6px 8px; font-size: 12px; box-shadow: 0 4px 14px rgba(0,0,0,.12);
  white-space: nowrap; display: none; z-index: 2;
}
.tip b { font-weight: 600; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12.5px; color: var(--ink-2); margin-top: 8px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.sw { width: 16px; height: 0; border-top: 2px solid; display: inline-block; }
.sw.dash { border-top-style: dashed; border-color: var(--ink-2); }
.sw.box { height: 10px; border: 0; border-radius: 2px; }
.sig-detail { list-style: none; padding: 0; margin: 14px 0 0; display: flex; flex-direction: column; gap: 8px; }
.sig-detail li { display: grid; grid-template-columns: 18px 1fr; gap: 4px 6px; font-size: 13.5px; }
.sig-detail .ic { font-size: 11px; line-height: 20px; }
.sig-detail .d { color: var(--ink-2); font-size: 12.5px; grid-column: 2; }
table.lv { width: 100%; border-collapse: collapse; margin-top: 14px; font-size: 13px; }
table.lv th { text-align: left; font-weight: 500; color: var(--ink-2); padding: 5px 0; border-bottom: 1px solid var(--grid); }
table.lv td { padding: 5px 0 5px 12px; border-bottom: 1px solid var(--grid); text-align: right; vertical-align: top; }
table.lv th { vertical-align: top; white-space: nowrap; }
table.lv .sub { display: block; color: var(--muted); font-size: 12px; font-weight: 400; }
table.lv tr:last-child td, table.lv tr:last-child th { border-bottom: 0; }
.actions { display: flex; gap: 8px; margin-top: 14px; flex-wrap: wrap; }
.btn {
  display: inline-flex; align-items: center; gap: 6px; height: 38px; padding: 0 14px; border-radius: 10px;
  background: var(--ink); color: var(--page); text-decoration: none; font-size: 14px; font-weight: 550;
}
.btn.ghost { background: transparent; color: var(--ink); border: 1px solid var(--border); }

/* Fuß */
footer { color: var(--ink-2); font-size: 13px; padding: 8px 0 40px; border-top: 1px solid var(--border); }
footer h2 { font-size: 14px; color: var(--ink); margin: 18px 0 6px; }
footer dl { display: grid; grid-template-columns: max-content 1fr; gap: 4px 12px; margin: 0; }
footer dt { color: var(--ink); font-weight: 550; }
footer dd { margin: 0; }
.empty { text-align: center; color: var(--ink-2); padding: 40px 10px; }
</style>
</head>

</div>

const nf = (d) => new Intl.NumberFormat("de-DE", { minimumFractionDigits: d, maximumFractionDigits: d });
const fmtP = (x) => x == null ? "–" : nf(Math.abs(x) >= 10 ? 2 : 3).format(x);

const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const ICON = { bull: "▲", bear: "▼", watch: "◆" };
const DIRNAME = { bull: "Bullisch", bear: "Bärisch", watch: "Beobachten" };
const CATS = [
  ["rsi", "RSI"], ["macd", "MACD"], ["ma", "Gleitende Ø"], ["fib", "Fibonacci"], ["liq", "Liquidität"],
];
const ageText = (a) => a === 0 ? "aktuell" : a === 1 ? "vor 1 Tag" : `vor ${a} Tagen`;
const store = {
  get(k, d) { try { const v = localStorage.getItem("scanner:" + k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem("scanner:" + k, JSON.stringify(v)); } catch {} },
};

if (!DATA) {
  document.getElementById("list").innerHTML =
    '<div class="empty">Noch keine Daten. Starte <b>scanner.py</b>, dann erscheint hier das Dashboard.</div>';
  throw new Error("no data");
}

// ---------- Zustand ----------
const state = {
  q: "",
  dir: store.get("dir", "all"),
  cats: new Set(store.get("cats", [])),   // leer = alle Indikatoren
  sort: store.get("sort", "score"),
  showAll: false,
  conf: false,
  open: new Set(),
};

const stocks = DATA.stocks;
const fresh = (s) => s.sig.length > 0;

// ---------- Kopf, Kennzahlen, Fuß ----------
(function header() {
  const d = new Date(DATA.data_date + "T12:00:00");
  const day = d.toLocaleDateString("de-DE", { weekday: "short", day: "numeric", month: "long", year: "numeric" });
  const gen = new Date(DATA.generated);
  document.getElementById("meta").innerHTML =
    `${esc(DATA.index)} · Tageschart · Schlusskurse vom <b>${day}</b> · aktualisiert ${gen.toLocaleString("de-DE", { dateStyle: "short", timeStyle: "short" })}`;
  if (DATA.demo) {
    document.getElementById("banner").innerHTML =
      '<div class="demo-banner"><b>Demo-Ansicht:</b> Die Kurse hier sind erfunden, damit du das Dashboard ausprobieren kannst. ' +
      "Sobald der erste echte Scan gelaufen ist, siehst du hier die echten Signale.</div>";
  }
})();

function confluence(s) {
  const b = s.sig.filter((x) => x.dir === "bull").length;
  const r = s.sig.filter((x) => x.dir === "bear").length;
  return b >= 2 ? { dir: "bull", n: b } : r >= 2 ? { dir: "bear", n: r } : null;
}

const catOk = (x) => state.cats.size === 0 || state.cats.has(x.cat);

function renderTiles() {
  // Zählt Aktien (nicht Einzelsignale) – passend zum gewählten Indikator-Filter
  const n = (dir) => stocks.filter((s) => s.sig.some((x) => catOk(x) && (dir === "all" || x.dir === dir))).length;
  const tiles = [
    { k: "all", lbl: "Aktien mit Signal", val: n("all"), sub: `von ${stocks.length}` },
    { k: "bull", lbl: `<span class="up">▲</span> Bullisch`, val: n("bull"), sub: "Kaufsignale, Kaufzonen" },
    { k: "bear", lbl: `<span class="down">▼</span> Bärisch`, val: n("bear"), sub: "Verkaufs-, Warnsignale" },
    { k: "watch", lbl: `<span style="color:var(--watch)">◆</span> Beobachten`, val: n("watch"), sub: "Kurs nähert sich Level" },
  ];
  document.getElementById("tiles").innerHTML = tiles.map((t) =>
    `<button class="tile" data-k="${t.k}" aria-pressed="${state.dir === t.k}">
      <div class="lbl">${t.lbl}</div><div class="val">${t.val}</div><div class="sub">${t.sub}</div></button>`
  ).join("");
}

document.getElementById("tiles").addEventListener("click", (e) => {
  const b = e.target.closest(".tile"); if (!b) return;
  state.dir = b.dataset.k;
  store.set("dir", state.dir);
  render();
});

(function footer() {
  const s = DATA.settings;
  const failed = DATA.failed && DATA.failed.length ? `<p>Keine Daten erhalten für: ${DATA.failed.map(esc).join(", ")}</p>` : "";
  document.getElementById("footer").innerHTML = `
    <h2>Was die Signale bedeuten</h2>
    <dl>
      <dt>RSI</dt><dd>RSI(${s.rsi[0]}) unter ${s.rsi[1]} = überverkauft (▲), über ${s.rsi[2]} = überkauft (▼).</dd>
      <dt>MACD</dt><dd>MACD(${s.macd.join(", ")}) kreuzt seine Signallinie.</dd>
      <dt>Gleitende Ø</dt><dd>Golden/Death Cross (SMA ${s.cross[0]}/${s.cross[1]}) und Schlusskurs kreuzt EMA ${s.emas.join(" bzw. ")}.</dd>
      <dt>Fibonacci</dt><dd>Trendbasierte Extension über die letzten drei signifikanten Wendepunkte A→B→C.
        Im Abwärtstrend sind ${s.fib.map((x) => nf(1).format(x * 100).replace(",0", "") + " %").join(" und ")} mögliche Kaufzonen (▲),
        im Aufwärtstrend Kursziele (▼). ◆ = Kurs nähert sich dem Level.</dd>
      <dt>Liquidität</dt><dd>Nach „Liquidity Swings“ (LuxAlgo, Pivot ${s.liq[0]}): Schlusskurs bricht durch eine Swing-Zone,
        in der sich mindestens das ${nf(0).format(s.liq[1])}-Fache des durchschnittlichen Tagesvolumens gesammelt hat.</dd>
    </dl>
    <p>Kreuzungen zählen, wenn sie in den letzten ${DATA.lookback} Handelstagen passiert sind.</p>
    ${failed}
    <p>Automatisch erzeugt aus Daten von Yahoo Finance. Kann Fehler enthalten und ist keine Anlageberatung.</p>`;
})();

// ---------- Filter-Chips ----------
function renderChips() {
  const dirOk = (x) => state.dir === "all" || x.dir === state.dir;
  const catCount = (c) => stocks.filter((s) => s.sig.some((x) => x.cat === c && dirOk(x))).length;
  const confCount = stocks.filter(confluence).length;
  document.getElementById("catChips").innerHTML =
    `<button class="chip" data-cat="" aria-pressed="${state.cats.size === 0}">Alle Indikatoren</button>` +
    CATS.map(([c, lbl]) =>
      `<button class="chip" data-cat="${c}" aria-pressed="${state.cats.has(c)}">${lbl} <span class="cnt">${catCount(c)}</span></button>`
    ).join("") +
    `<span class="sep"></span>
     <button class="chip" data-tg="conf" aria-pressed="${state.conf}">Konfluenz ≥ 2 <span class="cnt">${confCount}</span></button>
     <button class="chip" data-tg="all" aria-pressed="${state.showAll}">Auch ohne Signal</button>`;
}

document.getElementById("catChips").addEventListener("click", (e) => {
  const b = e.target.closest(".chip"); if (!b) return;
  if (b.dataset.tg === "conf") state.conf = !state.conf;
  else if (b.dataset.tg === "all") state.showAll = !state.showAll;
  else {
    const c = b.dataset.cat;
    if (!c) state.cats.clear();
    else if (state.cats.has(c)) state.cats.delete(c);
    else state.cats.add(c);
    if (state.cats.size === CATS.length) state.cats.clear();
    store.set("cats", [...state.cats]);
  }
  render();
});
document.getElementById("q").addEventListener("input", (e) => { state.q = e.target.value.trim().toUpperCase(); render(); });
const sortSel = document.getElementById("sort");
sortSel.value = state.sort;
sortSel.addEventListener("change", () => { state.sort = sortSel.value; store.set("sort", state.sort); render(); });

// ---------- Liste ----------
function visibleSignals(s) {
  return s.sig.filter((x) => catOk(x) && (state.dir === "all" || x.dir === state.dir));
}

function score(s, vis) {
  const c = confluence(s);
  return (c ? c.n * 10 : 0) + vis.length * 3 - Math.min(...vis.map((x) => x.age), 9) * 0.5;
}

function render() {
  renderTiles();
  renderChips();
  const q = state.q;
  let rows = stocks.map((s) => ({ s, vis: visibleSignals(s) }));
  rows = rows.filter(({ s, vis }) => {
    if (q) return s.t.includes(q) || s.n.toUpperCase().includes(q);
    if (state.conf && !confluence(s)) return false;
    return state.showAll || vis.length > 0;
  });
  const by = {
    score: (a, b) => score(b.s, b.vis) - score(a.s, a.vis) || a.s.t.localeCompare(b.s.t),
    new: (a, b) => Math.min(9, ...a.vis.map((x) => x.age)) - Math.min(9, ...b.vis.map((x) => x.age)) || b.vis.length - a.vis.length,
    chg: (a, b) => (b.s.chg ?? 0) - (a.s.chg ?? 0),
    rsi: (a, b) => (a.s.rsi ?? 50) - (b.s.rsi ?? 50),
    az: (a, b) => a.s.t.localeCompare(b.s.t),
  }[state.sort];
  rows.sort(by);

  document.getElementById("countLine").textContent =
    rows.length === 1 ? "1 Aktie" : `${rows.length} Aktien`;
  const list = document.getElementById("list");
  if (!rows.length) {
    list.innerHTML = '<div class="empty">Keine Treffer für diese Filter.</div>';
    return;
  }
  list.innerHTML = rows.map(({ s, vis }) => cardHTML(s, q || state.showAll ? (vis.length ? vis : s.sig) : vis)).join("");
  for (const t of state.open) {
    const card = list.querySelector(`.card[data-t="${CSS.escape(t)}"]`);
    if (card) openDetail(card, false);
  }
}

function cardHTML(s, sigs) {
  const cls = s.chg > 0 ? "up" : s.chg < 0 ? "down" : "";
  const c = confluence(s);
  const chips = sigs.map((x) =>
    `<span class="sig ${x.dir}"><span class="ic" aria-label="${DIRNAME[x.dir]}">${ICON[x.dir]}</span>${esc(x.label)}${x.age ? ` <span class="age">· ${ageText(x.age)}</span>` : ""}</span>`
  ).join("");
  const badges = [];
  if (c) badges.push(`<span class="badge conf"><span class="${c.dir === "bull" ? "up" : "down"}">${ICON[c.dir]}</span> ${c.n}× ${c.dir === "bull" ? "bullisch" : "bärisch"}</span>`);
  if (s.rsi != null) badges.push(`<span class="badge num">RSI ${nf(1).format(s.rsi)}</span>`);
  if (s.above200 != null) badges.push(`<span class="badge">${s.above200 ? "über" : "unter"} SMA 200</span>`);
  return `<article class="card" data-t="${esc(s.t)}">
    <button class="card-head" aria-expanded="${state.open.has(s.t)}">
      <div class="row1">
        <div class="left"><span class="tkr">${esc(s.t)}</span><span class="nm">${esc(s.n)}</span></div>
        <div class="px num"><span class="p">${fmtP(s.c)}</span><span class="chg ${cls}">${s.chg == null ? "" : fmtPct(s.chg)}</span></div>
      </div>
      ${chips ? `<div class="sigs">${chips}</div>` : '<div class="no-sig">Keine aktuellen Signale</div>'}
      <div class="badges">${badges.join("")}</div>
    </button>
  </article>`;
}

document.getElementById("list").addEventListener("click", (e) => {
  const head = e.target.closest(".card-head"); if (!head) return;
  const card = head.parentElement;
  const t = card.dataset.t;
  if (state.open.has(t)) {
    state.open.delete(t);
    card.querySelector(".detail")?.remove();
    head.setAttribute("aria-expanded", "false");
  } else {
    state.open.add(t);
    openDetail(card, true);
  }
});

function openDetail(card, scroll) {
  const s = stocks.find((x) => x.t === card.dataset.t);
  if (!s || card.querySelector(".detail")) return;
  card.querySelector(".card-head").setAttribute("aria-expanded", "true");
  const div = document.createElement("div");
  div.className = "detail";
  const lineKeys = Object.keys(s.ch.lines);
  const lineName = (k) => k.replace("ema", "EMA ").replace("sma", "SMA ");
  const lineVar = (i) => `var(--s${i + 1})`;
  const last = (arr) => { for (let i = arr.length - 1; i >= 0; i--) if (arr[i] != null) return arr[i]; return null; };

  const legend = lineKeys.map((k, i) => `<span><i class="sw" style="border-color:${lineVar(i)}"></i>${lineName(k)} <span class="num">${fmtP(last(s.ch.lines[k]))}</span></span>`).join("")
    + (s.fib ? `<span><i class="sw dash"></i>Fib-Level</span>` : "")
    + (s.liq.length ? `<span><i class="sw box" style="background:var(--bull-tint);outline:1px solid var(--bull)"></i>Liq.-Zone Tief</span><span><i class="sw box" style="background:var(--bear-tint);outline:1px solid var(--bear)"></i>Liq.-Zone Hoch</span>` : "");

  const sigList = s.sig.length ? `<ul class="sig-detail">${s.sig.map((x) =>
    `<li><span class="ic" style="color:var(--${x.dir})">${ICON[x.dir]}</span><span><b>${esc(x.label)}</b> <span class="age" style="color:var(--muted)">· ${ageText(x.age)}</span></span><span class="d">${esc(x.detail)}</span></li>`
  ).join("")}</ul>` : "";

  const rows = [];
  if (s.fib) {
    const tr = s.fib.trend === "down" ? "Abwärtstrend" : "Aufwärtstrend";
    const [A, B, C] = s.fib.points;
    rows.push(`<tr><th>Fib-Punkte<span class="sub">${tr}</span></th><td class="num">A ${fmtP(A.p)} · B ${fmtP(B.p)} · C ${fmtP(C.p)}</td></tr>`);
    for (const [k, v] of Object.entries(s.fib.levels)) {
      const dist = (s.c / v - 1) * 100;
      const where = Math.abs(dist) < 0.05 ? "Kurs am Level" : `Kurs ${nf(1).format(Math.abs(dist))} % ${dist > 0 ? "darüber" : "darunter"}`;
      rows.push(`<tr><th>Fib ${nf(1).format(+k * 100).replace(",0", "")} %</th><td class="num">${fmtP(v)}<span class="sub">${where}</span></td></tr>`);
    }
  }
  for (const z of s.liq) {
    const lvl = z.kind === "high" ? z.top : z.btm;
    rows.push(`<tr><th>Liq.-Zone ${z.kind === "high" ? "Hoch" : "Tief"}${z.end != null ? '<span class="sub">gebrochen</span>' : ""}</th><td class="num">${fmtP(z.btm)} – ${fmtP(z.top)}<span class="sub">${z.touches} Kontakte · ${nf(1).format(z.score)}× Ø-Volumen</span></td></tr>`);
  }
  const table = rows.length ? `<table class="lv"><tbody>${rows.join("")}</tbody></table>` : "";

  div.innerHTML = `<div class="chart-box"><div class="tip"></div></div>
    <div class="legend">${legend}</div>${sigList}${table}
    <div class="actions">
      <a class="btn" href="https://www.tradingview.com/chart/?symbol=${encodeURIComponent(s.tv)}" target="_blank" rel="noopener">In TradingView öffnen ↗</a>
    </div>`;
  card.appendChild(div);
  drawChart(s, div.querySelector(".chart-box"));
  if (scroll) card.scrollIntoView({ block: "nearest", behavior: "smooth" });
}

// ---------- Mini-Chart (SVG) ----------
function drawChart(s, box) {
  const ch = s.ch;
  const n = ch.c.length;
  const W = Math.max(280, box.clientWidth);
  const H = 250, padL = 4, padR = 54, padT = 24, padB = 22;
  const pw = W - padL - padR, ph = H - padT - padB;
  let lo = Math.min(...ch.l.filter((x) => x != null)), hi = Math.max(...ch.h.filter((x) => x != null));
  const span0 = hi - lo;
  const extra = [];
  if (s.fib) extra.push(...Object.values(s.fib.levels));
  for (const z of s.liq) extra.push(z.top, z.btm);
  for (const v of extra) if (v >= lo - span0 * 0.4 && v <= hi + span0 * 0.4) { lo = Math.min(lo, v); hi = Math.max(hi, v); }
  const pad = (hi - lo) * 0.04; lo -= pad * 1.8; hi += pad;
  const step = pw / n;
  const X = (i) => padL + step * (i + 0.5);
  const Y = (v) => padT + (hi - v) / (hi - lo) * ph;
  const NS = "http://www.w3.org/2000/svg";
  const parts = [];

  // Raster + Preisachse
  const ticks = niceTicks(lo, hi, 4);
  for (const t of ticks) {
    parts.push(`<line x1="${padL}" x2="${padL + pw}" y1="${Y(t)}" y2="${Y(t)}" stroke="var(--grid)" stroke-width="1"/>`);
    parts.push(`<text x="${W - 4}" y="${Y(t) + 4}" text-anchor="end" font-size="11" fill="var(--muted)" class="num">${fmtP(t)}</text>`);
  }
  // Monatsbeschriftung
  let lastM = null;
  ch.d.forEach((d, i) => {
    const m = d.slice(0, 7);
    if (m !== lastM && i > 2) {
      const dt = new Date(d + "T12:00:00");
      parts.push(`<line x1="${X(i)}" x2="${X(i)}" y1="${padT + ph}" y2="${padT + ph + 4}" stroke="var(--axis)"/>`);
      parts.push(`<text x="${X(i)}" y="${H - 5}" text-anchor="middle" font-size="11" fill="var(--muted)">${dt.toLocaleDateString("de-DE", { month: "short" })}</text>`);
    }
    lastM = m;
  });
  parts.push(`<line x1="${padL}" x2="${padL + pw}" y1="${padT + ph}" y2="${padT + ph}" stroke="var(--axis)" stroke-width="1"/>`);

  // Liquiditätszonen
  for (const z of s.liq) {
    if (z.top < lo || z.btm > hi) continue;
    const x1 = X(Math.max(0, z.i)) - step / 2, x2 = z.end == null ? padL + pw : X(Math.min(n - 1, z.end)) + step / 2;
    if (x2 <= padL) continue;
    const col = z.kind === "high" ? "bear" : "bull";
    const y1 = Y(z.top), y2 = Y(z.btm);
    parts.push(`<rect x="${x1}" y="${y1}" width="${Math.max(1, x2 - x1)}" height="${Math.max(1.5, y2 - y1)}" fill="var(--${col}-tint)"/>`);
    const edge = z.kind === "high" ? y1 : y2;
    parts.push(`<line x1="${x1}" x2="${x2}" y1="${edge}" y2="${edge}" stroke="var(--${col})" stroke-width="1" opacity=".7"/>`);
    parts.push(`<text x="${x2 - 3}" y="${z.kind === "high" ? y1 - 3 : y2 + 11}" text-anchor="end" font-size="10" fill="var(--ink-2)" stroke="var(--surface)" stroke-width="3" paint-order="stroke" stroke-linejoin="round">Liq ${nf(1).format(z.score)}×</text>`);
  }

  // Kerzen
  const bw = Math.max(1, Math.min(9, step * 0.62));
  for (let i = 0; i < n; i++) {
    const o = ch.o[i], h = ch.h[i], l = ch.l[i], c = ch.c[i];
    if (c == null) continue;
    const col = c >= o ? "var(--bull)" : "var(--bear)";
    parts.push(`<line x1="${X(i)}" x2="${X(i)}" y1="${Y(h)}" y2="${Y(l)}" stroke="${col}" stroke-width="1"/>`);
    const yt = Y(Math.max(o, c)), yb = Y(Math.min(o, c));
    parts.push(`<rect x="${X(i) - bw / 2}" y="${yt}" width="${bw}" height="${Math.max(1, yb - yt)}" fill="${col}" rx="${bw > 4 ? 1 : 0}"/>`);
  }

  // Gleitende Durchschnitte (auf den Plotbereich zugeschnitten)
  const clipId = "clip-" + s.t.replace(/[^A-Za-z0-9]/g, "");
  parts.push(`<clipPath id="${clipId}"><rect x="${padL}" y="${padT - 6}" width="${pw}" height="${ph + 6}"/></clipPath><g clip-path="url(#${clipId})">`);
  Object.keys(ch.lines).forEach((k, idx) => {
    let d = "", pen = false;
    ch.lines[k].forEach((v, i) => {
      if (v == null) { pen = false; return; }
      d += `${pen ? "L" : "M"}${X(i).toFixed(1)},${Y(v).toFixed(1)}`; pen = true;
    });
    parts.push(`<path d="${d}" fill="none" stroke="var(--s${idx + 1})" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/>`);
  });
  parts.push(`</g>`);

  // Fibonacci
  if (s.fib) {
    const C = s.fib.points[2];
    const x0 = C.i >= 0 ? X(C.i) : padL;
    for (const [k, v] of Object.entries(s.fib.levels)) {
      if (v < lo || v > hi) continue;
      parts.push(`<line x1="${x0}" x2="${padL + pw}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--ink-2)" stroke-width="1.2" stroke-dasharray="5 4"/>`);
      parts.push(`<text x="${x0 + 4}" y="${Y(v) - 4}" font-size="10.5" font-weight="600" fill="var(--ink-2)" stroke="var(--surface)" stroke-width="3" paint-order="stroke" stroke-linejoin="round">Fib ${nf(1).format(+k * 100).replace(",0", "")} % · ${fmtP(v)}</text>`);
    }
    for (const [j, p] of s.fib.points.entries()) {
      if (p.i < 0 || p.i >= n) continue;
      const isHigh = p.t === "H";
      const y = Y(p.p) + (isHigh ? -9 : 9);
      parts.push(`<circle cx="${X(p.i)}" cy="${y}" r="7" fill="var(--surface)" stroke="var(--ink-2)" stroke-width="1"/>`);
      parts.push(`<text x="${X(p.i)}" y="${y + 3.5}" text-anchor="middle" font-size="9.5" font-weight="700" fill="var(--ink)">${"ABC"[j]}</text>`);
    }
  }

  // Letzter Kurs auf der Achse
  const lc = ch.c[n - 1];
  parts.push(`<rect x="${W - padR + 3}" y="${Y(lc) - 8}" width="${padR - 4}" height="16" rx="3" fill="var(--ink)"/>`);
  parts.push(`<text x="${W - 4}" y="${Y(lc) + 4}" text-anchor="end" font-size="11" font-weight="600" fill="var(--page)" class="num">${fmtP(lc)}</text>`);

  // Hover-Ebene
  parts.push(`<line class="xh" x1="0" x2="0" y1="${padT}" y2="${padT + ph}" stroke="var(--ink-2)" stroke-width="1" visibility="hidden"/>`);
  parts.push(`<rect class="hit" x="${padL}" y="${padT}" width="${pw}" height="${ph}" fill="transparent"/>`);

  const old = box.querySelector("svg"); if (old) old.remove();
  const svg = document.createElementNS(NS, "svg");
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
  svg.setAttribute("height", H);
  svg.setAttribute("role", "img");
  svg.setAttribute("aria-label", `Kerzenchart ${s.t}, letzte ${n} Handelstage`);
  svg.innerHTML = parts.join("");
  box.appendChild(svg);

  const tip = box.querySelector(".tip"), xh = svg.querySelector(".xh"), hit = svg.querySelector(".hit");
  const move = (ev) => {
    const r = svg.getBoundingClientRect();
    const px = (ev.clientX - r.left) * (W / r.width);
    const i = Math.max(0, Math.min(n - 1, Math.floor((px - padL) / step)));
    xh.setAttribute("x1", X(i)); xh.setAttribute("x2", X(i)); xh.setAttribute("visibility", "visible");
    const dt = new Date(ch.d[i] + "T12:00:00").toLocaleDateString("de-DE", { weekday: "short", day: "numeric", month: "short" });
    const chg = i > 0 && ch.c[i - 1] ? (ch.c[i] / ch.c[i - 1] - 1) * 100 : null;
    tip.innerHTML = `<b>${dt}</b>${chg == null ? "" : ` <span class="${chg >= 0 ? "up" : "down"}">${fmtPct(chg)}</span>`}<br>
      <span class="num">O ${fmtP(ch.o[i])} · H ${fmtP(ch.h[i])}<br>L ${fmtP(ch.l[i])} · C ${fmtP(ch.c[i])}</span>`;
    tip.style.display = "block";
    const left = X(i) * (r.width / W);
    const tw = tip.offsetWidth;
    tip.style.left = Math.min(Math.max(0, left > r.width / 2 ? left - tw - 10 : left + 10), r.width - tw) + "px";
    tip.style.top = "6px";
  };
  const leave = () => { tip.style.display = "none"; xh.setAttribute("visibility", "hidden"); };
  hit.addEventListener("pointermove", move);
  hit.addEventListener("pointerdown", move);
  hit.addEventListener("pointerleave", leave);
  box._redraw = () => drawChart(s, box);
}

function niceTicks(lo, hi, count) {
  const raw = (hi - lo) / count;
  const mag = Math.pow(10, Math.floor(Math.log10(raw)));
  const step = [1, 2, 2.5, 5, 10].map((m) => m * mag).find((s) => s >= raw);
  const out = [];
  for (let v = Math.ceil(lo / step) * step; v <= hi; v += step) out.push(+v.toFixed(10));
  return out;
}

let rt;
window.addEventListener("resize", () => {
  clearTimeout(rt);
  rt = setTimeout(() => document.querySelectorAll(".chart-box").forEach((b) => b._redraw && b._redraw()), 150);
});

render();
</script>
</body>
</html>
